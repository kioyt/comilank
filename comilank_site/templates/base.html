<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comilank - {% block title %}{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a0b; color:#f0f0f0; font-family:'Inter',sans-serif; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .container { max-width:800px; width:100%; background:#141416; border-radius:48px; padding:48px; box-shadow:0 0 0 1px rgba(232,101,10,0.06), 0 25px 50px rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.06); }

        /* Flash-сообщения */
        .flash-container { margin-bottom:20px; }
        .flash { padding:15px 20px; border-radius:30px; margin-bottom:10px; font-weight:500; display:flex; align-items:center; gap:10px; }
        .flash.success { background:rgba(255,102,0,0.2); border:1px solid #ff6600; color:#ffaa33; }
        .flash.error { background:rgba(255,0,0,0.2); border:1px solid #ff4444; color:#ff8888; }
        .flash i { font-size:1.5rem; }

        h1, h2 { color:#ff6600; margin-bottom:20px; }
        .form-group { margin-bottom:20px; }
        label { display:block; margin-bottom:5px; color:#aaa; }
        input[type="text"], input[type="email"], input[type="password"], select { width:100%; padding:12px; background:#0f0f11; border:1px solid rgba(255,255,255,0.07); border-radius:30px; color:#fff; font-size:1rem; }
        input:focus { outline:none; border-color:#e8650a; }
        .btn { background:#e8650a; color:#0a0a0b; border:none; padding:12px 24px; border-radius:60px; cursor:pointer; font-weight:600; transition:0.2s; }
        .btn:hover { background:#ff7820; transform:scale(1.05); box-shadow:0 0 15px rgba(232,101,10,0.5); }
        .btn-secondary { background:rgba(255,255,255,0.04); color:#c9cdd6; border:1px solid rgba(232,101,10,0.25); }
        .btn-secondary:hover { background:rgba(232,101,10,0.1); color:#e8650a; }
        .link { color:#e8650a; text-decoration:none; }
        .link:hover { text-decoration:underline; }
        .user-info { display:flex; gap:20px; align-items:center; margin-bottom:20px; }
        .avatar { width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid #e8650a; }
        hr { border:1px solid rgba(255,255,255,0.05); margin:20px 0; }
        .text-center { text-align:center; }

        /* Таблица пользователей (для админки) */
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th { background:#0f0f11; color:#c8580a; padding:10px; text-align:left; }
        td { padding:10px; border-bottom:1px solid rgba(255,255,255,0.05); }
        select { background:#0f0f11; color:#c9cdd6; padding:5px; border-radius:20px; }
        /* Кнопка полного экрана — фиксированная, на всех страницах */
        #_fs_btn {
            position: fixed;
            top: 16px; right: 16px;
            z-index: 9000;
            width: 34px; height: 34px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(232,101,10,0.28);
            border-radius: 9px;
            color: #e8650a;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s ease;
            backdrop-filter: blur(6px);
        }
        #_fs_btn:hover {
            background: rgba(232,101,10,0.12);
            border-color: rgba(232,101,10,0.6);
            box-shadow: 0 0 12px rgba(232,101,10,0.2);
            transform: scale(1.08);
        }
        #_fs_btn svg {
            width: 15px; height: 15px;
            stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        /* Скрываем глобальную кнопку на страницах где есть своя */
        body.has-own-fs #_fs_btn { display: none !important; }
    </style>
</head>
<body class="{% block body_class %}{% endblock %}">
<!-- Кнопка полного экрана (на всех страницах) -->
<button id="_fs_btn" title="Полный экран" onclick="_fsToggle()">
    <svg id="_fs_icon" viewBox="0 0 24 24">
        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
    </svg>
</button>
<script>
var _fsExpand   = '<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>';
var _fsCompress = '<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>';
function _fsToggle(){
    var ic = document.getElementById('_fs_icon');
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        if (ic) ic.innerHTML = _fsCompress;
    } else {
        document.exitFullscreen && document.exitFullscreen();
        if (ic) ic.innerHTML = _fsExpand;
    }
}
document.addEventListener('fullscreenchange', function(){
    var ic = document.getElementById('_fs_icon');
    if (ic) ic.innerHTML = document.fullscreenElement ? _fsCompress : _fsExpand;
});
</script>
<script>
// ── VPN детектор v3 — мультиAPI, надёжный ──
(function(){
    // Для сброса кэша при тесте: sessionStorage.removeItem('vpn_ok')
    if (sessionStorage.getItem('vpn_ok')) return;

    var _shown = false;

    function showVpnNotice() {
        if (_shown) return;
        _shown = true;
        sessionStorage.setItem('vpn_ok','1');

        var st = document.createElement('style');
        st.textContent =
            '@keyframes _vpnIn{0%{opacity:0;transform:translateY(20px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}' +
            '@keyframes _vpnOut{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(14px)}}';
        document.head.appendChild(st);

        var box = document.createElement('div');
        box.id = '_vpn_box';
        box.innerHTML =
            '<div style="width:3px;flex-shrink:0;border-radius:3px;background:linear-gradient(180deg,#e8650a,#c8450a);align-self:stretch"></div>'+
            '<div style="flex:1;padding-left:12px">'+
              '<div style="color:#e8650a;font-size:0.73rem;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;display:flex;align-items:center;gap:5px">'+
                '<span>⚠</span><span>Обнаружен VPN</span>'+
              '</div>'+
              '<div style="color:#8a909e;font-size:0.79rem;line-height:1.6">'+
                'Мы обнаружили, что вы используете <strong style="color:#c9cdd6">VPN</strong>. Просим отключить его — иначе сайт может работать некорректно.'+
              '</div>'+
              '<button id="_vpn_ok" style="margin-top:10px;padding:5px 16px;border-radius:8px;background:rgba(232,101,10,.12);border:1px solid rgba(232,101,10,.4);color:#e8650a;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s">✓ Понятно</button>'+
            '</div>'+
            '<button id="_vpn_x" style="flex-shrink:0;margin-left:8px;margin-top:-2px;background:none;border:none;color:#454a56;font-size:1.15rem;cursor:pointer;line-height:1;padding:2px 4px;transition:color .15s">&times;</button>';

        Object.assign(box.style, {
            position:'fixed', bottom:'22px', right:'22px', zIndex:'2147483647',
            background:'rgba(16,16,18,0.97)',
            border:'1px solid rgba(232,101,10,.22)',
            borderRadius:'14px', padding:'14px 16px',
            maxWidth:'300px', width:'calc(100vw - 44px)',
            display:'flex', alignItems:'flex-start', gap:'0',
            boxShadow:'0 4px 8px rgba(0,0,0,.4), 0 16px 48px rgba(0,0,0,.7), 0 0 0 1px rgba(232,101,10,.06)',
            fontFamily:'Inter,-apple-system,sans-serif',
            animation:'_vpnIn .4s cubic-bezier(.22,.68,0,1.2) both'
        });

        document.body.appendChild(box);

        function closeBox() {
            box.style.animation = '_vpnOut .25s ease both';
            setTimeout(function(){ if (box.parentNode) box.remove(); }, 270);
        }
        document.getElementById('_vpn_ok').addEventListener('click', closeBox);
        document.getElementById('_vpn_x').addEventListener('click', closeBox);
    }

    // ── Попытка 1: vpnapi.io (бесплатный, надёжный) ──
    function tryVpnApi(ip) {
        return fetch('https://vpnapi.io/api/' + ip + '?key=free')
            .then(function(r){ return r.json(); })
            .then(function(d){
                if (d && d.security && (d.security.vpn || d.security.proxy || d.security.tor)) {
                    showVpnNotice(); return true;
                }
                return false;
            });
    }

    // ── Попытка 2: proxycheck.io ──
    function tryProxyCheck(ip) {
        return fetch('https://proxycheck.io/v2/' + ip + '?vpn=1&asn=1')
            .then(function(r){ return r.json(); })
            .then(function(data){
                var keys = Object.keys(data).filter(function(k){ return k!=='status'&&k!=='message'; });
                if (!keys.length) return false;
                var info = data[keys[0]];
                if (info && (info.proxy==='yes' || info.vpn==='yes' || info.type==='VPN')) {
                    showVpnNotice(); return true;
                }
                return false;
            });
    }

    // ── Попытка 3: ip-api.com (поле proxy) ──
    function tryIpApi(ip) {
        return fetch('https://ip-api.com/json/' + ip + '?fields=proxy,hosting')
            .then(function(r){ return r.json(); })
            .then(function(d){
                if (d && (d.proxy || d.hosting)) {
                    showVpnNotice(); return true;
                }
                return false;
            });
    }

    // ── Получаем IP, затем цепочка проверок ──
    setTimeout(function(){
        fetch('https://api.ipify.org?format=json')
        .then(function(r){ return r.json(); })
        .then(function(d){
            var ip = (d && d.ip) ? d.ip : '';
            if (!ip) return;

            // Запускаем все три параллельно — первый нашедший VPN покажет уведомление
            tryVpnApi(ip).catch(function(){
                tryProxyCheck(ip).catch(function(){
                    tryIpApi(ip).catch(function(){});
                });
            });
            // Запускаем второй и третий независимо для надёжности
            setTimeout(function(){
                if (!_shown) tryProxyCheck(ip).catch(function(){});
            }, 800);
            setTimeout(function(){
                if (!_shown) tryIpApi(ip).catch(function(){});
            }, 1600);
        })
        .catch(function(){
            // Fallback: пробуем ipapi.co для получения IP
            fetch('https://ipapi.co/json/')
            .then(function(r){ return r.json(); })
            .then(function(d){
                var ip = (d && d.ip) ? d.ip : '';
                if (!ip) return;
                tryProxyCheck(ip).catch(function(){});
                setTimeout(function(){ if (!_shown) tryIpApi(ip).catch(function(){}); }, 1000);
            }).catch(function(){});
        });
    }, 1500);

})();
</script>
    <div class="container">
        <!-- Flash-сообщения -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">
                            {% if category == 'success' %}
                                <i class="fas fa-check-circle"></i>
                            {% elif category == 'error' %}
                                <i class="fas fa-exclamation-triangle"></i>
                            {% else %}
                                <i class="fas fa-info-circle"></i>
                            {% endif %}
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
