<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comilank — {% block title %}{% endblock %}</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0c0c0c; color:#f0f0f0; font-family:'Inter',sans-serif; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .container { max-width:800px; width:100%; background:#121212; border-radius:48px; padding:48px; box-shadow:0 25px 50px -8px rgba(255,102,0,0.25); border:1px solid #2a2a2a; }

        /* Flash-сообщения */
        .flash-container { margin-bottom:20px; }
        .flash { padding:15px 20px; border-radius:30px; margin-bottom:10px; font-weight:500; display:flex; align-items:center; gap:10px; }
        .flash.success { background:rgba(255,102,0,0.2); border:1px solid #ff6600; color:#ffaa33; }
        .flash.error { background:rgba(255,0,0,0.2); border:1px solid #ff4444; color:#ff8888; }
        .flash i { font-size:1.5rem; }

        h1, h2 { color:#ff6600; margin-bottom:20px; }
        .form-group { margin-bottom:20px; }
        label { display:block; margin-bottom:5px; color:#aaa; }
        input[type="text"], input[type="email"], input[type="password"], select { width:100%; padding:12px; background:#1e1e1e; border:1px solid #2a2a2a; border-radius:30px; color:#fff; font-size:1rem; }
        input:focus { outline:none; border-color:#ff6600; }
        .btn { background:#ff6600; color:#121212; border:none; padding:12px 24px; border-radius:60px; cursor:pointer; font-weight:600; transition:0.2s; }
        .btn:hover { background:#ff8533; transform:scale(1.05); box-shadow:0 0 15px #ff6600; }
        .btn-secondary { background:#2a2a2a; color:#fff; border:1px solid #ff6600; }
        .btn-secondary:hover { background:#ff6600; color:#121212; }
        .link { color:#ff6600; text-decoration:none; }
        .link:hover { text-decoration:underline; }
        .user-info { display:flex; gap:20px; align-items:center; margin-bottom:20px; }
        .avatar { width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid #ff6600; }
        hr { border:1px solid #2a2a2a; margin:20px 0; }
        .text-center { text-align:center; }

        /* Таблица пользователей (для админки) */
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th { background:#1a1a1a; color:#ffaa33; padding:10px; text-align:left; }
        td { padding:10px; border-bottom:1px solid #2a2a2a; }
        select { background:#1e1e1e; color:#fff; padding:5px; border-radius:20px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Flash-сообщения -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-container">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">
                            {% if category == 'success' %}
                                <i class="fas fa-check-circle"></i>
                            {% elif category == 'error' %}
                                <i class="fas fa-exclamation-triangle"></i>
                            {% else %}
                                <i class="fas fa-info-circle"></i>
                            {% endif %}
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
