{% extends "base.html" %}

{% block title %}{{ page.title }} | Comilank{% endblock %}

{% block content %}
<style>
    .extra-container {
        max-width: 900px;
        margin: 0 auto;
    }
    .extra-header {
        margin-bottom: 30px;
        border-bottom: 1px solid #2a2a2a;
        padding-bottom: 20px;
    }
    .extra-header h1 {
        color: #ff6600;
        font-size: 2.5rem;
        margin-bottom: 15px;
        text-shadow: 0 0 10px rgba(255,102,0,0.3);
    }
    .extra-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        color: #aaa;
        font-size: 1rem;
    }
    .extra-meta span {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .extra-meta i {
        color: #ff6600;
    }
    .extra-content {
        font-size: 1.1rem;
        line-height: 1.7;
        color: #f0f0f0;
        margin: 30px 0;
        background: #1a1a1a;
        border-radius: 30px;
        padding: 30px;
        border: 1px solid #2a2a2a;
    }
    .extra-content img {
        max-width: 100%;
        border-radius: 20px;
        margin: 20px 0;
    }
    .back-link {
        margin-top: 30px;
        text-align: center;
    }
    .back-link a {
        color: #ff6600;
        text-decoration: none;
        font-size: 1.2rem;
        border: 1px solid #ff6600;
        padding: 10px 30px;
        border-radius: 50px;
        transition: 0.3s;
        display: inline-block;
    }
    .back-link a:hover {
        background: #ff6600;
        color: #121212;
        box-shadow: 0 0 20px #ff6600;
    }
</style>

<div class="extra-container">
    <div class="extra-header">
        <h1>{{ page.title }}</h1>
        <div class="extra-meta">
            <span><i class="fas fa-user"></i> {{ page.author.username }}</span>
            <span><i class="fas fa-calendar"></i> {{ page.created_at.strftime('%d.%m.%Y') }}</span>
            <span><i class="fas fa-eye"></i> {{ page.views }} просмотров</span>
            <span><i class="fas fa-book-open"></i> <a href="{{ url_for('article', article_id=page.article_id) }}" style="color: #ffaa33;">Вернуться к статье</a></span>
        </div>
    </div>

    <div class="extra-content">
        {{ page.content|safe }}
    </div>

    <div class="back-link">
        <a href="{{ url_for('article', article_id=page.article_id) }}">
            <i class="fas fa-arrow-left"></i> Назад к статье
        </a>
    </div>
</div>
{% endblock %}
