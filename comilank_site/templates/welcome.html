<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comilank — Добро пожаловать</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0c0c0c; color:#f0f0f0; font-family:'Inter',sans-serif; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; overflow:hidden; position:relative; }
        .floating-icons { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; }
        .icon { position:absolute; font-size:32px; opacity:0.12; color:#aaa; animation:float 12s infinite alternate ease-in-out; }
        @keyframes float { 0%{transform:translateY(0px) rotate(0deg);} 100%{transform:translateY(-40px) rotate(12deg);} }
        .icon1 { top:5%; left:2%; animation-duration:11s; } .icon2 { top:12%; right:4%; animation-duration:13s; } .icon3 { bottom:8%; left:5%; animation-duration:9s; } .icon4 { bottom:18%; right:7%; animation-duration:14s; } .icon5 { top:25%; left:10%; animation-duration:10s; } .icon6 { top:35%; right:11%; animation-duration:12s; } .icon7 { bottom:25%; left:13%; animation-duration:8s; } .icon8 { bottom:35%; right:14%; animation-duration:15s; } .icon9 { top:45%; left:18%; animation-duration:9.5s; } .icon10 { top:55%; right:18%; animation-duration:11.5s; } .icon11 { bottom:45%; left:20%; animation-duration:10.5s; } .icon12 { bottom:55%; right:22%; animation-duration:13.5s; } .icon13 { top:8%; left:25%; animation-duration:12.5s; } .icon14 { top:18%; right:25%; animation-duration:8.5s; } .icon15 { bottom:12%; left:28%; animation-duration:14.5s; } .icon16 { bottom:22%; right:28%; animation-duration:9.2s; } .icon17 { top:65%; left:30%; animation-duration:11.2s; } .icon18 { top:75%; right:30%; animation-duration:10.2s; }
        .welcome-container {
            max-width: 600px;
            width: 100%;
            background: #121212;
            border-radius: 48px;
            padding: 60px 40px;
            box-shadow: 0 25px 50px -8px rgba(255,102,0,0.25);
            border: 1px solid #2a2a2a;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(4px);
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            color: #ff6600;
            margin-bottom: 40px;
            text-shadow: 0 0 15px #ff6600;
        }
        .continue-btn {
            background: #ff6600;
            border: none;
            color: #121212;
            padding: 18px 50px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.6rem;
            box-shadow: 0 0 30px #ff6600;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .continue-btn:hover {
            transform: scale(1.05);
            background: #ff8533;
            box-shadow: 0 0 50px #ff6600;
        }
    </style>
</head>
<body>
    <!-- Плавающие иконки -->
    <div class="floating-icons">
        <i class="icon icon1 fa-solid fa-gamepad"></i>
        <i class="icon icon2 fa-solid fa-computer-mouse"></i>
        <i class="icon icon3 fa-solid fa-keyboard"></i>
        <i class="icon icon4 fa-solid fa-headphones"></i>
        <i class="icon icon5 fa-solid fa-display"></i>
        <i class="icon icon6 fa-solid fa-floppy-disk"></i>
        <i class="icon icon7 fa-solid fa-compact-disc"></i>
        <i class="icon icon8 fa-solid fa-camera"></i>
        <i class="icon icon9 fa-solid fa-microchip"></i>
        <i class="icon icon10 fa-solid fa-wifi"></i>
        <i class="icon icon11 fa-solid fa-bolt"></i>
        <i class="icon icon12 fa-solid fa-crown"></i>
        <i class="icon icon13 fa-solid fa-cloud"></i>
        <i class="icon icon14 fa-solid fa-tree"></i>
        <i class="icon icon15 fa-solid fa-cat"></i>
        <i class="icon icon16 fa-solid fa-moon"></i>
        <i class="icon icon17 fa-solid fa-star"></i>
        <i class="icon icon18 fa-solid fa-sun"></i>
    </div>

    <div class="welcome-container">
        <h1>
            {% if request.referrer and 'login' in request.referrer %}
                С возвращением, {{ current_user.username }}!
            {% else %}
                Добро пожаловать, {{ current_user.username }}!
            {% endif %}
        </h1>
        <a href="{{ url_for('index') }}" class="continue-btn">Продолжить</a>
    </div>
</body>
</html>
